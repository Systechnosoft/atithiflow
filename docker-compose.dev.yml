services:
  db:
    image: postgres:15-alpine
    container_name: atithiflow-db-dev
    environment:
      POSTGRES_DB: atithiflow
      POSTGRES_USER: atithi
      POSTGRES_PASSWORD: atithi_password
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atithi} -d ${POSTGRES_DB:-atithiflow} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - atithi-net

  backend:
    image: node:20-alpine
    container_name: atithiflow-backend-dev
    working_dir: /usr/src/app
    env_file:
      - ./hotel-api/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./hotel-api:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atithi-net

  frontend:
    image: node:20-alpine
    container_name: atithiflow-frontend-dev
    working_dir: /app
    env_file:
      - ./hotel-ui/.env
    environment:
      - NODE_ENV=development
    volumes:
      - ./hotel-ui:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - atithi-net

volumes:
  db_data_dev:

networks:
  atithi-net:
    driver: bridge
